    ProofCodeGenerated:
      type: object
      description: Payload sent to your webhook callback when a proof of delivery code is generated for
        a parcel.
      required:
      - parcel_id
      - code
      properties:
        parcel_id:
          type: string
          format: uuid
          description: UUID of the parcel this code was generated for.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        code:
          type: string
          description: Four-digit code generated for the delivery. The recipient must provide this code
            to the driver to confirm receipt.
          example: '1234'
    ParcelLocation:
      type: object
      description: Payload sent to your webhook callback URL with the driver's real-time location.
      required:
      - parcel_id
      - location
      - state
      properties:
        parcel_id:
          type: string
          format: uuid
          description: UUID of the parcel being tracked.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        external_id:
          type: string
          description: Your own identifier for this parcel, as provided when the parcel was created.
          example: parcel_001
        location:
          type: object
          description: Current location of the driver carrying the parcel.
          required:
          - latitude
          - longitude
          properties:
            latitude:
              type: number
              format: float
              description: Latitude in decimal degrees.
              example: 40.4489254
            longitude:
              type: number
              format: float
              description: Longitude in decimal degrees.
              example: -3.6730293
        state:
          type: string
          description: Indicates whether the driver is on the way to collect the parcel or has already
            picked it up.
          enum:
          - onroutetopickup
          - intransit
    WebhookSubscription:
      type: object
      required:
      - callback_url
      - hook
      properties:
        hook:
          type: string
          enum:
          - parcel
          - parcelLocation
          - proofCodeGenerated
          description: 'The event type to subscribe to: - `parcel`: Triggered on every parcel status change.
            - `parcelLocation`: Triggered when the driver''s location is updated. - `proofCodeGenerated`:
            Triggered when a proof of delivery code is generated for a parcel.

            '
        callback_url:
          type: string
          format: uri
          example: http://example.com/your/callback/here
          description: Your endpoint URL. The API will send a POST request to this URL each time the subscribed
            event occurs.
        headers:
          type: array
          items:
            $ref: '#/components/schemas/Header'
          description: Custom headers to include in every webhook request sent to your endpoint (e.g.
            for authentication).
    PickupAttempt:
      type: object
      description: Details of a pickup attempt, whether successful or not.
      required:
      - status
      - attempted_at
      - address
      properties:
        fail_reason:
          type: string
          description: 'If the attempt was unsuccessful, the reason why it failed. See [pickup failed
            reasons](https://developers.cabify.com/reference/parcel-information#pickup-failed-reason)
            for a description of each value.

            '
          enum:
          - sender_no_show
          - sender_too_late
          - address_wrong
          - address_not_found
          - address_unsafe
          - parcel_suspicious
          - parcel_packaging
          - parcel_too_big_or_heavy
          - payment_requested
          - payment_fake
          - other_with_feedback
          - place_closed
          - delivery_not_found
          - already_picked_up
          - delivery_cancelled
        status:
          type: string
          description: Outcome of the pickup attempt.
          enum:
          - PickupAttemptStatusPickedUp
          - PickupAttemptStatusPickupFailed
        attempted_at:
          type: string
          format: date-time
          description: Timestamp of the pickup attempt, formatted according to RFC 3339, section 5.6.
          example: '2021-12-02T10:12:07.753Z'
        address:
          type: string
          description: Address where the pickup attempt was made.
          example: Calle de la Princesa, 1, 28008 Madrid
        feedback:
          type: string
          description: Comments left by the driver about the pickup attempt.
          example: can't find the address
        photo_proof_of_pickup:
          $ref: '#/components/schemas/PhotoProofOfPickUp'
        comment_proof_of_pickup:
          $ref: '#/components/schemas/CommentProofOfPickUp'
    PhotoProofOfPickUp:
      type: object
      description: Photo evidence captured by the driver at the pickup location.
      properties:
        photo_urls:
          type: array
          description: List of URLs to the photos taken by the driver during pickup.
          items:
            type: string
            format: url
    CommentProofOfPickUp:
      type: object
      description: Written note left by the driver as confirmation of the pickup.
      properties:
        comment:
          type: string
          description: Comment left by the driver at the time of pickup.
    ParcelTimeline:
      type: object
      required:
      - id
      - timeline
      properties:
        id:
          type: string
          format: uuid
          description: System-generated UUID for this parcel.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        external_id:
          type: string
          description: Your own identifier for this parcel, as provided when the parcel was created.
          example: parcel_001
        timeline:
          type: array
          description: Chronological list of state-change events for this parcel.
          items:
            $ref: '#/components/schemas/TimelineEvent'
    TimelineEvent:
      type: object
      required:
      - state
      - state_updated_at
      properties:
        state:
          type: string
          description: 'The lifecycle state the parcel transitioned into. See [parcel states](https://developers.cabify.com/reference/logistics-introduction#parcel)
            for a full description of each value.

            '
          enum:
          - ready
          - qualifiedforpickup
          - pickingup
          - intransit
          - delivering
          - delivered
          - returning
          - returned
          - incident
          - requestercancel
          - internalcancel
          - pickupfailed
          - onroutetopickup
          - readytopickup
          - onroutetofinalhub
          - receivedonfinalhub
          - readytodispatch
          - onroutetodelivery
          - undelivered
          - onroutetoreturn
          - returnrejected
        state_updated_at:
          type: string
          format: date-time
          description: Timestamp when the parcel transitioned into this state, formatted according to
            RFC 3339, section 5.6.
          example: '2021-12-02T10:12:07.753Z'
    CreateTip:
      required:
      - amount
      type: object
      properties:
        amount:
          minimum: 0
          type: integer
          description: 'Tip amount in the smallest currency unit, following the ISO 4217 standard (e.g.
            €6.30 → `630`).

            '
          example: 100
    UpdateParcel:
      type: object
      description: Fields that can be updated on an existing parcel. Only fields included in the request
        will be modified.
      properties:
        external_id:
          type: string
          description: Your own identifier for this parcel. Must be unique across all your parcels.
          example: parcel_001
        pickup_info:
          $ref: '#/components/schemas/ParcelPointPickupInfo'
        dropoff_info:
          $ref: '#/components/schemas/ParcelPointDropoffInfo'
        dimensions:
          $ref: '#/components/schemas/ParcelDimensions'
        weight:
          $ref: '#/components/schemas/ParcelWeight'
        delivery_from:
          type: string
          format: date-time
          description: 'Start of the requested delivery time window, formatted according to RFC 3339,
            section 5.6. The parcel will not be delivered before this time.

            '
          example: '2021-12-02T10:12:07.753Z'
        delivery_to:
          type: string
          format: date-time
          description: 'End of the requested delivery time window, formatted according to RFC 3339, section
            5.6. The parcel should be delivered before this time.

            '
          example: '2021-12-02T10:12:07.753Z'
        price:
          $ref: '#/components/schemas/Price'
  securitySchemes:
    bearer_token:
      type: http
      scheme: bearer
