          $ref: '#/components/schemas/DriverStopBeforePickup'
        is_driver_on_another_journey:
          description: Whether the assigned driver is currently completing another trip before heading
            to the pickup.
          nullable: false
          type: boolean
        journey_id:
          description: UUID of the journey.
          nullable: false
          type: string
        preassigned_driver:
          $ref: '#/components/schemas/PreassignedDriver'
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        waypoints:
          $ref: '#/components/schemas/Waypoint'
      title: JourneyState
      type: object
    Driver:
      description: Driver's information.
      example:
        avatar_url: https://secure.gravatar.com/avatar/675ee8c314586d36a7b33c6c773565e9?r=pg&s=80&=blank
        id: e8417e8cd14c11ec869eb2e3f32e3b38
        name: John
        phone_number: '34611111111'
      properties:
        avatar_url:
          description: Driver's picture.
          type: string
        id:
          description: Id of the driver
          nullable: false
          type: string
        name:
          description: Driver's name.
          type: string
        phone_number:
          description: Driver's phone number.
          type: string
      title: Driver
      type: object
    Row:
      description: Point and state through which the driver passed during the journey.
      example:
        loc:
        - 40.4169335
        - -3.7061872
        state_name: hired
      properties:
        loc:
          default: []
          description: The actual coordinates of the address. Required floats per location latitude and
            longitude.
          items:
            format: float
            type: number
          type: array
        state_name:
          description: Status of the journey at the time the driver passed through that point.
          nullable: false
          type: string
      title: Row
      type: object
    PreassignedDriver:
      description: 'Driver preassigned to the journey (for example on a reservation) before the journey
        is actually assigned. It does not include the phone number, and it may change or disappear before
        the journey starts. `driver` always takes precedence: once a driver is assigned, that `driver`
        is authoritative and this field is only informative about who had been preassigned.'
      example:
        avatar_url: https://secure.gravatar.com/avatar/1a79a4d60de6718e8e5b326e338ae533?r=pg&s=80&=blank
        id: a1b2c3d4e5f611ec869eb2e3f32e3b38
        name: Diana
      nullable: true
      properties:
        avatar_url:
          description: Preassigned driver's picture.
          type: string
        id:
          description: Id of the preassigned driver
          nullable: false
          type: string
        name:
          description: Preassigned driver's first name.
          type: string
      title: PreassignedDriver
      type: object
    DriverStopBeforePickup:
      description: Best-effort location where the driver is heading before coming to the pickup. May be
        null even when is_driver_on_another_journey is true.
      example:
        loc:
        - 40.4201
        - -3.7056
      nullable: true
      properties:
        loc:
          description: Latitude and longitude of the driver's current destination.
          items:
            format: float
            type: number
          nullable: false
          type: array
      title: DriverStopBeforePickup
      type: object
    PaginatedLabelResponse:
      description: Response schema for a list of labels
      example:
        data:
        - active: true
          client_id: 5ad782201d2e111dba689aa86d149702
          description: Cabify label example
          id: 9a0e2da7-f93a-4b24-bce4-7a8b10d3997a
          name: ' Name of the Label'
          slug: name-of-the-label
        page: 1
        pages: 1
        per: 20
        total: 3
      properties:
        data:
          description: The list of labels
          items:
            $ref: '#/components/schemas/Label'
          type: array
        page:
          description: Current page.
          type: integer
        pages:
          description: Number of pages fetched.
          type: integer
        per:
          description: Amount of labels per page.
          type: integer
        total:
          description: total of results.
          type: integer
      title: PaginatedLabelResponse
      type: object
    Expense:
      example:
        data:
        - code: ESP22AX002004
          concept:
            type: journey
            type_object:
              charge_code: P004
              country: ES
              description: 2022-02-17. Sol, Madrid. P004
              end_at: '2022-02-17T09:31:27.028Z'
              id: 41f11290-8fd4-11ec-879a-acde48001122
              region: madrid
              start_at: '2022-02-17T09:30:34.831Z'
          currency: EUR
          invoice_date: '2022-02-21'
          price_details:
            discount: 0
            tax_rate: 0
            tax_type: iva
            total: 0
        page: 1
        pages: 1
        per: 25
        total: 3
      properties:
        data:
          description: List of sales
          items:
            $ref: '#/components/schemas/Sale'
          type: array
        page:
          description: Number of page to fetch.
          type: integer
        pages:
          description: Total amount of pages.
          type: integer
        per:
          description: Amount of sales by page.
          type: integer
        total:
          description: Amount total of users obtained in all the pages.
          type: integer
      title: Expense
      type: object
    User:
      example:
        email: john.doe@example.com
        id: 9a0e2da7f93a4b24bce47a8b10d3997a
        mobile_cc: '34'
        mobile_num: '612345678'
        name: John
        surname: Doe
      properties:
        can_manage:
          description: Whether User is an admin or regular User
          type: boolean
        can_order_for_others:
          description: If true, user will be able to order journeys for others
          type: boolean
        default_charge_code:
          description: User's Default Charge Code
          type: string
        disabled:
          description: Whether the User is enabled or disabled
          type: boolean
        email:
          description: Email of User. Must be unique
          format: email
          type: string
        email_cc:
          description: List of email addresses (for journey related emails only)
          items:
            type: string
          type: array
        employee_code:
          description: User's Employee Code, useful to map with company's code
          type: string
        id:
          description: id of the User, UUIDv4 format without hyphens
          pattern: ^[a-f0-9]{32}$
          type: string
        locale:
          description: 'User''s Locale. Syntax consists of language two-letter tag which then will be
            suffixed with Client''s country, e.g.: es-ES'
          type: string
        mobile_cc:
          description: 'Mobile Country Code. Can be checked here: https://countrycode.org/'
          type: string
        mobile_num:
          description: Mobile Number of User
          type: string
        name:
          description: Name of the User
          type: string
        permission_group_id:
          description: User's TravelPolicy
          nullable: true
          type: string
        surname:
          description: Surname of the User
          type: string
      required:
      - id
      - email
      - name
      - surname
      - mobile_cc
      - mobile_num
      title: User
      type: object
    PageResponse:
      example:
        data: []
        page: 2
        pages: 0
        per: 1
        total: 0
      properties:
        data:
          description: List of Users
          items:
            $ref: '#/components/schemas/User'
          type: array
        page:
          description: Number of page returned
          type: number
        pages:
          description: Number of total available pages
          type: number
        per:
          description: Number of elements per page
          type: number
        total:
          description: Number of total available elements
          type: number
      required:
      - data
      - per
      - page
      - total
      - pages
      title: PageResponse
      type: object
