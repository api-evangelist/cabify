  /api/v4/user/{user_id}/sales:
    get:
      callbacks: {}
      description: Fetch user's sales paginated
      operationId: getUserSales
      parameters:
      - description: Id of the user
        example: 6f80363aa84fa61a58dc5720
        in: path
        name: user_id
        required: true
        schema:
          type: string
      - description: Start date
        example: '2021-12-01'
        in: query
        name: from
        required: true
        schema:
          format: date
          pattern: '[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])'
          type: string
      - description: End date
        example: '2021-12-01'
        in: query
        name: to
        required: true
        schema:
          format: date
          pattern: '[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])'
          type: string
      - description: Currency of the sale
        example: EUR
        in: query
        name: currency
        required: true
        schema:
          default: EUR
          enum:
          - EUR
          - CLP
          - PEN
          - MXN
          - COP
          - USD
          - BRL
          - ARS
          type: string
      - description: Number of page to fetch
        example: 1
        in: query
        name: page
        required: true
        schema:
          default: 1
          type: integer
      - description: Amount of sales per page
        example: 20
        in: query
        name: per
        required: true
        schema:
          default: 20
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedRequest'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not found
        '500':
          content:
            application/text:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal server error
      summary: Get user's sales paginated
      tags:
      - Sales
  /api/v4/journey/{id}/keep_searching:
    post:
      callbacks: {}
      description: "If there are no drivers available after having created a journey (meaning you receive\
        \ a\n 'not found' state via webhooks or via the GET journey/state endpoints), with this\n endpoint,\
        \ you can continue searching for drivers for the same exact journey without the\n  need of a new\
        \ estimation.\n\nThe journey will enter again in the 'hire' state for another 5 minutes (this\
        \ time cannot be changed).\n\n"
      operationId: keepSearching
      parameters:
      - description: Id of the journey
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Empty Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedRequest'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: Not found
        '500':
          content:
            application/text:
              schema:
                $ref: '#/components/schemas/InternalServerError'
          description: Internal server error
      summary: Keep searching drivers for a journey
      tags:
      - Journeys
components:
  schemas:
    BadRequest:
      description: Indicates that the server cannot or will not process the request due to something that
        is perceived to be a client error (for example, malformed request syntax, invalid request message
        framing, or deceptive request routing).
      example:
        error: Bad Request error message
      properties:
        message:
          type: string
      title: BadRequest
      type: object
    Conflict:
      description: The request conflicts with the current state of the resource. For journey cancellation,
        this means the journey has already been cancelled, terminated, or is in a non-cancellable state.
      example:
        error: journey has already been terminated
      properties:
        error:
          type: string
      title: Conflict
      type: object
    UnauthorizedRequest:
      description: The token used is invalid either because it is expired or because it is incorrect.
      example:
        error: Unauthorized
      properties:
        error:
          type: string
      title: UnauthorizedRequest
      type: object
    JourneyResponse:
      example:
        id: 0397896-19aa-11ed-b6fe-7aaea8067492
      properties:
        id:
          description: journey_id of the current operation.
          type: string
      title: JourneyResponse
      type: object
    InternalServerError:
      description: indicates that an internal server error occurred
      example:
        error: Something went wrong
      properties:
        error:
          type: string
      title: InternalServerError
      type: object
    Rider:
      description: Input data defining the rider of a journey.
      example:
        email: riderEmail@example.com
        locale: ES
        mobile:
          mobile_cc: '34'
          mobile_num: '123456789'
        name: John Doe
      properties:
        email:
          description: Rider's email.
          format: email
          nullable: true
          type: string
        id:
          description: Id of the Rider that will travel, if the Rider is a User of your company this will
            be the User's id (can be same as requester_id to request a journey for yourself). Leave empty
            when the Rider is external to your company.
          pattern: ^[a-f0-9]{32}$
          type: string
        locale:
          description: Rider's Locale. Syntax consists of language two-letter tag which then will be suffixed
            with Client's country.
          nullable: true
          type: string
        mobile:
          $ref: '#/components/schemas/Mobile'
        name:
          description: Rider's name. Required when the rider is external.
          type: string
      title: Rider
      type: object
    NotFound:
      description: The server did not find a current representation for the target resource
      example:
        error: user with provided ID does not exist
      properties:
        message:
          type: string
      title: NotFound
      type: object
    MeetingPoint:
      description: A specific meeting point within a hub location (e.g. a terminal at an airport). Obtained
        from the hub data returned in the estimates response.
      example:
        id: mp_001
        loc:
        - 40.4722
        - -3.5608
        name: Terminal 1 - Puerta de llegadas
      properties:
        id:
          description: Unique identifier of the meeting point.
          type: string
        loc:
          description: Coordinates of the meeting point as [latitude, longitude].
          items:
            format: float
            type: number
          maxItems: 2
          minItems: 2
          type: array
        name:
          description: Display name of the meeting point.
          type: string
      required:
      - id
      - loc
      - name
      title: MeetingPoint
      type: object
    JourneyRequest:
      additionalProperties: false
      description: 'Input object needed to create a new journey.


        > ⚠️ Always estimate before creating a journey

        >

        > You **must** call `/estimates` before creating a journey. The estimation response provides:

        > - `product.id` — the product to book

        > - Pricing and availability information valid at the time of the estimate

        >

        > Pass `product.id` as `product_id` in this request. For **reserved** journeys, also pass the
        same

        > `start_at` you used in the estimation request to guarantee consistent pricing and availability.

        >

        > We recommend estimating no more than **5 minutes** before creating the journey.

        '
      example:
        label_slug: null
        message: Test message for driver
        product_id: 75dd566797369d1f0927102e5356ce59
        reason: Test reason for driver
        requester_id: 081a70a52cfc11ecbb03a25a490feee4
        rider:
          email: riderEmail@example.com
          locale: ES
          mobile:
            mobile_cc: '34'
            mobile_num: '123456789'
          name: Jhon Doe
        start_at: '2022-07-01 10:00:00'
        stops:
        - addr: Madrid Barajas T1
          city: Madrid
          contact:
            mobile_cc: '34'
            mobile_num: '123456789'
            name: Jhon Doe
            stop_action: pickup
          country: ES
          loc:
          - 40.4722
          - -3.5608
          location_id: location-4
          meeting_point:
            id: mp-loc4-1
            loc:
            - 40.4722
            - -3.5608
            name: Terminal 1
          name: Work
          num: '1428'
        - addr: Calle de la cruz
          city: Madrid
          country: ES
          loc:
          - 40.4169335
          - -3.7061872
      properties:
        label_slug:
          description: If your company has the labels feature enabled (used to categorize expenses, receipts)
            than a valid label can be provided and it will be associated to a journey for later financial
            reporting purposes. Custom string which does not allow an empty string value '' Note that
            it can have a null value.
          nullable: true
          type: string
        message:
          description: A message that be associated to a journey that driver can see after they accept
            the ride. It's usually used to give any extra information that might help the driver in the
            pickup or to give any information that might help improving the journey experience.
          nullable: true
          type: string
        preferred_driver_id:
          description: Id of the preferred driver for this journey (UUID without hyphens). Only available
            for clients that have their own driver fleet.
          nullable: true
          type: string
        product_id:
          description: The product/vehicle category to book. **Must** come from a recent `/estimates`
            response (`product.id`). Products are dynamic and vary by location and time — never hardcode
            IDs. Always estimate first to discover available products.
          nullable: false
          type: string
        reason:
          description: Free text explaining the motive of the journey. It is available later in all expenditure
            reports together with the label (if used). Note that this has to be a valid string if the
            company decides to have this field as mandatory.
          nullable: true
          type: string
        requester_id:
          description: It represents the person who creates the ride and is also the passenger of the
            ride. Nevertheless if the rider object is provided then the passenger (rider) is a different
            person (check rider attribute for more info). The value of requesterIdshould correspond to
            a user.id of an registered user in the account.
          nullable: false
          pattern: ^[a-f0-9]{32}$
          type: string
        rider:
          $ref: '#/components/schemas/Rider'
        start_at:
          description: "Defines when the journey should start. Format: `YYYY-MM-DD HH:MM:SS` (local time\
            \ of the pickup location).\n\n- **ASAP rides**: Leave as `null` (or omit the field).\n- **Reservations**:\
            \ Set to a future time. **Use the same `start_at` value you provided in the `/estimates` request**\
            \ to ensure consistent product availability and pricing.\n  - Minimum: 30 minutes from now\n\
            \  - Maximum: 60 days in advance\n"
          nullable: true
          pattern: '[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1]) (2[0-3]|[01][0-9]):[0-5][0-9]:[0-5][0-9]'
          type: string
        stops:
          items:
            $ref: '#/components/schemas/StopRequest'
          maxItems: 15
          minItems: 2
          type: array
      required:
      - product_id
      - requester_id
      - rider
      - stops
      title: JourneyRequest
      type: object
    Contact:
      description: Contact details on each Stop. Include this object if you want the Driver to see additional
        Contact details on each Stop.
      example:
        mobile_cc: '34'
        mobile_num: '123456789'
        name: Jhon Doe
        stop_action: pickup
      properties:
        mobile_cc:
          description: Mobile Country Code of the Contact of the Stop passed when creating the Journey.
          type: string
        mobile_num:
          description: Mobile Number of the Contact of the Stop passed when creating the Journey.
          type: string
        name:
          description: Name of the Contact of the Stop passed when creating the Journey.
          type: string
        stop_action:
          description: 'Action to be performed on the Stop. Possible values: ''pickup'', ''dropoff''.
            Ignored when it is included in the `contact` field (`stop/contact`), i.e. only taken into
            account when specific for the contacts within `stop/contacts`.'
          enum:
          - pickup
          - dropoff
          nullable: false
          type: string
      title: Contact
      type: object
    Mobile:
      description: Input Mobile Number. Required when the rider is external. Journey's SMS state updates
        will arrive to this mobile.
      example:
        mobile_cc: '34'
        mobile_num: '123456789'
      properties:
        mobile_cc:
          description: Mobile Country Code. Required if mobileNum is provided.
          nullable: false
          pattern: ^\+?\d+$
          type: string
        mobile_num:
          description: Rider's phone number.
          nullable: false
          pattern: ^[0-9]+$
          type: string
      required:
      - mobile_cc
      - mobile_num
      title: Mobile
      type: object
    StopRequest:
      description: 'Stop of a journey. A journey needs to have at least 2 stops: the first one is considered
        the pickup point the last one the destination.'
      example:
        addr: Calle de la cruz
        city: Madrid
        contact:
          mobile_cc: '34'
          mobile_num: '123456789'
          name: Jhon Doe
          stop_action: pickup
        country: ES
        loc:
        - 40.4169335
        - -3.7061872
        location_id: location-4
        meeting_point:
          id: mp-loc4-1
          loc:
          - 40.4169335
          - -3.7061872
          name: Terminal 1
        name: Work
        num: '1428'
        postal_code: '28002'
      properties:
        addr:
          description: If an address was provided when creating the journey this field will have its value.
          type: string
        city:
          description: City name where the address is located, e.g. Madrid.
          type: string
        contact:
          $ref: '#/components/schemas/Contact'
        contacts:
          description: List of contacts for the stop. Only one of `contact` or `contacts` should be provided.
          items:
            $ref: '#/components/schemas/Contact'
          type: array
        country:
          description: Country name where the address is located, e.g. Spain.
          type: string
        instr:
          description: Set of instructions for the Driver.
          type: string
        loc:
          default: []
          description: The actual coordinates of the address. Required floats per location latitude and
            longitude.
          items:
            format: float
            type: number
          maxItems: 2
          minItems: 2
          type: array
        location_id:
          description: Internal location identifier for hub stops. Required when a meeting_point is provided.
            Obtained from the hub data returned by GET /hub or POST /estimates.
          type: string
        meeting_point:
          $ref: '#/components/schemas/MeetingPoint'
        name:
          description: A short name for previously stored addresses. These can be viewed in places.
          type: string
        num:
          description: Street number.
          type: string
        postal_code:
          description: Postal code of the address.
          type: string
      required:
      - loc
      title: StopRequest
      type: object
    LabelResponse:
      description: Response schema for single label
      example:
        active: true
        client_id: 5ad782201d2e111dba689aa86d149702
        description: Cabify label example
        id: 9a0e2da7-f93a-4b24-bce4-7a8b10d3997a
        name: ' Name of the Label'
        slug: name-of-the-label
      properties:
        data:
          $ref: '#/components/schemas/Label'
      title: LabelResponse
      type: object
    LabelRequest:
      additionalProperties: false
      description: POST body for creating a label
      example:
        active: true
        description: Some description of the label
        name: Cabify label example
      properties:
        active:
          description: If false the Label is disabled
          type: boolean
        description:
          description: Description of the Label
          type: string
        name:
          description: Name of the Label
          type: string
      required:
      - name
      title: LabelRequest
      type: object
    Label:
      example:
        active: true
        client_id: 5ad782201d2e111dba689aa86d149702
        description: Cabify label example
        id: 9a0e2da7-f93a-4b24-bce4-7a8b10d3997a
        name: Name of the Label
        slug: name-of-the-label
      properties:
        active:
          description: If false the Label is disabled
          type: boolean
        client_id:
          description: client_id owner of the label
          type: string
        description:
          description: Description of the Label
          type: string
        id:
          description: id of the Label. This UUID Version 4 is a universally unique identifier.
          type: string
        name:
          description: Name of the Label
          type: string
        slug:
          description: ' Slug of the Label. Its autogenerated, downcasing all letters, transliterating
            Unicode characters into alphanumeric strings (e.g. `á` into `a`), stripping punctuation and
            replacing spaces with `-`'
          type: string
      required:
      - client_id
      - slug
      title: Label
      type: object
    MutationResponse:
      description: Response coming either from a Create or Update request
      example:
        job_id: 7e3b1f8a4c92d5e0a6b17c3f
      properties:
        job_id:
          description: id of job processing the update. The results will be sent asynchronously to predefined
            webhooks URL upon job termination
          pattern: ^[a-f0-9]{24}$
          type: string
      required:
      - job_id
      title: MutationResponse
      type: object
    CreateUsersRequest:
      description: List of new data to create new Users with it
      items:
        $ref: '#/components/schemas/CreateUser'
      minItems: 1
      title: CreateUsersRequest
      type: array
    CreateUser:
      example:
        can_manage: false
        can_order_for_others: false
        disabled: false
        email: john.doe@example.com
        mobile_cc: '34'
        mobile_num: '612345678'
        name: John
        surname: Doe
      properties:
        can_manage:
          description: Whether User is an admin or regular User
          type: boolean
        can_order_for_others:
          description: If true, user will be able to order journeys for others
          type: boolean
        default_charge_code:
          description: User's Default Charge Code
          type: string
        disabled:
          description: Whether the User is enabled or disabled
          type: boolean
        email:
          description: Email of User. Must be unique
          format: email
          type: string
        email_cc:
          description: List of email addresses (for journey related emails only)
          items:
            type: string
          type: array
        employee_code:
          description: User's Employee Code, useful to map with company's code
          type: string
        locale:
          description: 'User''s Locale. Syntax consists of language two-letter tag which then will be
            suffixed with Client''s country, e.g.: es-ES'
          type: string
        mobile_cc:
          description: 'Mobile Country Code. Can be checked here: https://countrycode.org/'
          type: string
        mobile_num:
          description: Mobile Number of User
          type: string
        name:
          description: Name of the User
          type: string
        permission_group_id:
          description: User's TravelPolicy
          nullable: true
          type: string
        send_email:
          description: If true an email will be sent to the user upon creation
          type: boolean
        surname:
          description: Surname of the User
          type: string
      required:
      - email
      - name
      - surname
      - mobile_cc
      - mobile_num
      title: CreateUser
      type: object
    EstimateRequest:
      additionalProperties: false
      description: 'Request an estimate before creating a journey.


        The estimation response provides the `product.id` value that **must** be passed to the journey

        creation endpoint. For **reserved** journeys, also pass the same `start_at` used here to the

        journey creation request to ensure consistent pricing and availability.


        We recommend requesting a new estimate no more than **5 minutes** before creating a journey.

        '
      example:
        requester_id: 0d3cd443da5f11eb89d7ea639ff4befb
        start_at: '2022-07-01 10:00:00'
        start_type: asap
        stops:
        - loc:
          - 40.4169335
          - -3.7061872
        - loc:
          - 40.4169335
          - -3.7061872
      properties:
        requester_id:
          description: User to which the estimates would be scoped.
          nullable: false
          pattern: ^[a-f0-9]{32}$
          type: string
        start_at:
          description: When using startType RESERVED this attribute defines the date and time of the reservation.
            Accepted format must be YYYY-MM-DD HH:MM:SS. It should be in the local time of the pick up
            location.
          nullable: true
          pattern: ^([0-9]+(-[0-9]+)+)\s+([0-9]+(:[0-9]+)+)$
          type: string
        start_type:
          description: Specifies whether the journey should start right now or it should be a reservation
            later in time. Note that if the value is RESERVED startAt attribute has to be a valid date.
            If ASAP startAt will be ignored.
          enum:
          - asap
          - reserved
          nullable: false
          type: string
        stops:
          default: []
          description: The actual coordinates of the address. Required two floats per location latitude
            and longitude.
          items:
            properties:
              loc:
                items:
                  type: number
                maxItems: 2
                minItems: 2
                type: array
            type: object
          minItems: 2
          type: array
      required:
      - start_type
      - requester_id
      - stops
      title: EstimateRequest
      type: object
    EstimateResponse:
      description: 'List of available products with pricing for the requested route.


        Each item contains the `product.id` needed to create a journey. Use this value as `product_id`

        in the journey creation request.

        '
      example:
      - distance: 1831
        duration: 1260
        eta:
          formatted: 10 min
          low_availability: true
        product:
          description: The standard option, with all the usual perkss
          id: d79565b5b64d9d46549925c254793937
          name: Cabify Executive.
