    HubObject:
      description: A hub is a large venue (e.g. airport, train station) with designated pick-up/drop-off
        meeting points.
      example:
        active: true
        location_id: location-4
        meeting_points:
        - bottom_image_url: https://example.com/t1-bottom.png
          coordinates:
            latitude: 40.4722
            longitude: -3.5608
          header_image_url: https://example.com/t1-header.png
          instructions:
          - en: Head to the main gate of Terminal 1
            es: Dirígete a la puerta principal de la Terminal 1
            step_image_url: https://example.com/step1.png
          title:
            en: Terminal 1
            es: Terminal 1
          uid: mp-loc4-1
        title:
          en: Madrid Barajas
          es: Madrid Barajas
        uid: hub-loc4
      nullable: true
      properties:
        active:
          description: Whether the hub is currently active.
          type: boolean
        location_id:
          description: Location identifier used to look up this hub.
          type: string
        meeting_points:
          description: Designated pick-up/drop-off points within the hub. Present one of these to the
            user as their boarding location.
          items:
            properties:
              bottom_image_url:
                description: URL for the bottom image of the meeting point.
                nullable: true
                type: string
              coordinates:
                description: GPS coordinates of the meeting point.
                properties:
                  latitude:
                    type: number
                  longitude:
                    type: number
                type: object
              header_image_url:
                description: URL for the header image of the meeting point.
                nullable: true
                type: string
              instructions:
                description: Step-by-step instructions to reach the meeting point.
                items:
                  properties:
                    en:
                      type: string
                    es:
                      type: string
                    step_image_url:
                      nullable: true
                      type: string
                  type: object
                type: array
              title:
                additionalProperties:
                  type: string
                description: Localized name of the meeting point, keyed by BCP 47 language tag.
                type: object
              uid:
                description: Unique identifier of the meeting point.
                type: string
            type: object
          type: array
        title:
          additionalProperties:
            type: string
          description: Localized name of the hub, keyed by BCP 47 language tag.
          type: object
        uid:
          description: Unique identifier of the hub.
          type: string
      title: HubObject
      type: object
    HubResponse:
      description: Hub information for a given set of coordinates. Returns null inside the data field
        when no hub exists at those coordinates.
      properties:
        data:
          $ref: '#/components/schemas/HubObject'
      title: HubResponse
      type: object
    Price:
      description: Price in the currency smallest unit.
      example:
        amount: 100
        currency: EUR
      nullable: false
      properties:
        amount:
          description: Amount in cents. *For CLP this field is in currency units
          nullable: false
          type: integer
        currency:
          description: Currency code in ISO_4217 format
          nullable: false
          type: string
      title: Price
      type: object
    Totals:
      description: Price breakdown for the journey. Only populated after the journey reaches `terminated`
        state.
      example:
        discount:
          amount: 0
          currency: EUR
        price:
          amount: 100
          currency: EUR
        price_total:
          amount: 100
          currency: EUR
      nullable: true
      properties:
        discount:
          $ref: '#/components/schemas/Price'
        price:
          $ref: '#/components/schemas/Price'
        price_total:
          $ref: '#/components/schemas/Price'
      title: Totals
      type: object
    StopResponse:
      description: 'Stop of a journey. A journey needs to have at least 2 stops: the first one is considered
        the pickup point the last one the destination.'
      example:
        addr: Calle de la cruz
        city: Madrid
        contact:
          mobile_cc: '34'
          mobile_num: '123456789'
          name: Jhon Doe
          stop_action: pickup
        country: ES
        id: '123'
        loc:
        - 40.4169335
        - -3.7061872
        name: Work
        num: '1428'
        postal_code: '28002'
      properties:
        addr:
          description: If an address was provided when creating the journey this field will have its value.
          type: string
        city:
          description: City name where the address is located, e.g. Madrid.
          type: string
        contact:
          $ref: '#/components/schemas/Contact'
        contacts:
          default: []
          description: List of contacts for the stop, in case of multiple contacts.
          items:
            $ref: '#/components/schemas/Contact'
          type: array
        country:
          description: Country name where the address is located, e.g. España.
          type: string
        hit_at:
          description: DateTime when the driver arrived at the indicated point.
          format: date-time
          type: string
        id:
          description: Id of the stop.
          type: string
        instr:
          description: Set of instructions for the Driver.
          type: string
        loc:
          default: []
          description: The actual coordinates of the address. Required floats per location latitude and
            longitude.
          items:
            format: float
            type: number
          type: array
        meeting_point:
          $ref: '#/components/schemas/MeetingPoint'
        name:
          description: A short name for previously stored addresses. These can be viewed in places.
          type: string
        num:
          description: Street number.
          type: string
        postal_code:
          description: Postal code of the address.
          type: string
      required:
      - loc
      title: StopResponse
      type: object
    Journey:
      description: Booking-level details of a journey including stops, pricing, timestamps, and lifecycle
        status.
      example:
        created_at: '2022-08-04T19:28:18.375Z'
        current_state: terminated
        end_at: '2022-02-17T09:30:34.831Z'
        end_state: drop off
        finished: true
        id: 96fc6f24-142b-11ed-bba7-56a6f40ef0bf
        label_slug: apiV4
        product_id: 75dd566797369d1f0927102e5356ce59
        public_url: /j/5ceg7v77qm8x28c9
        region_id: madrid
        start_at: '2022-02-17T09:30:34.831Z'
        start_type: asap
        stops:
        - addr: Calle de la cruz
          city: Madrid
          contact:
            mobile_cc: '34'
            mobile_num: '123456789'
            name: Jhon Doe
            stop_action: pickup
          country: ES
          id: '123'
          loc:
          - 40.4169335
          - -3.7061872
          name: Work
          num: '1428'
        totals:
          discount:
            amount: 0
            currency: EUR
          price:
            amount: 100
            currency: EUR
          price_total:
            amount: 100
            currency: EUR
        user_id: 0dfc7c0bbbd300e6f9212827106e8911
      properties:
        created_at:
          description: ISO 8601 datetime when the journey was created.
          format: date-time
          type: string
        current_state:
          description: Current lifecycle state of the journey (e.g. hire, hired, arrived, pick up, terminated).
          type: string
        end_at:
          description: ISO 8601 datetime when the journey ended. Null while still active.
          nullable: true
          type: string
        end_state:
          default: not found
          description: The reason the journey ended. Null while the journey is still active.
          enum:
          - drop off
          - driver cancel
          - not found
          - no show
          - rider cancel
          nullable: true
          type: string
        finished:
          description: Whether the journey has reached an end state (drop off, cancel, no show, or not
            found).
          type: boolean
        id:
          description: UUID of the journey.
          type: string
        label_slug:
          description: Slug of the label (cost center, project code) associated with this journey for
            expense reporting.
          type: string
        product_id:
          description: ID of the vehicle category/product used for this journey, as returned by the estimates
            endpoint.
          type: string
        public_url:
          description: Shareable URL that allows anyone to track the journey in real time without authentication.
          nullable: true
          type: string
        region_id:
          description: Identifier of the city/region where the journey takes place.
          type: string
        start_at:
          description: ISO 8601 datetime when the journey started (driver began moving toward pickup).
            Null for journeys still in `hire` state.
          nullable: true
          type: string
        start_type:
          description: Whether the journey was requested immediately or scheduled for a future time.
          enum:
          - asap
          - reserved
          nullable: false
          type: string
        stops:
          items:
            $ref: '#/components/schemas/StopResponse'
          type: array
        totals:
          $ref: '#/components/schemas/Totals'
        user_id:
          description: ID of the user who requested the journey.
          type: string
      required:
      - id
      title: Journey
      type: object
