aid: cabify
name: Cabify
description: >-
  Cabify is a Spanish multi-mobility company founded in 2011 and headquartered in Madrid, operating
  ride-hailing, corporate mobility, and last-mile logistics across Spain and Latin America (6+
  countries and 40+ cities). Its public developer platform exposes two authenticated REST APIs: a
  Ride-Hailing API (v4) for price estimation, journey booking, real-time state tracking, rider and
  label management, and sales reporting; and a Logistics API (v1) for creating, shipping, tracking,
  and configuring proof of delivery for parcels, including ecommerce integrations with Shopify,
  Tiendanube, and VTEX. Both APIs authenticate with OAuth2 client-credentials access tokens
  (Bearer), publish independent sandbox environments, and deliver asynchronous updates via webhooks.
