- aid: cabify:cabify-labels-api
  name: Cabify Labels API
  description: >-
    Cabify offers to its clients a feature where the client’s employees have to input a journey motive
    or a project or a dynamic cost center associated with the new journey before requesting it. This is
    usually used for financial budgeting and reporting purposes since every journey now comes with this
    data linked to it, in other words, clients can segment their invoices by these Labels. <br> <br> Since
    some companies have a lot of Labels (projects/cost centers) that need to be managed they can use our
    API to do so. We allow creating, modifying, and disabling them directly from, for example, the client’s
    ERP (SAP, NetSuite, MSDynamics, etc.).
  humanURL: https://developers.cabify.com/docs/ride-hailing
  baseURL: https://cabify.com/api/v4
