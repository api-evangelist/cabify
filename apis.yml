- aid: cabify:cabify-sales-api
  name: Cabify Sales API
  description: >-
    Sales objects are created once a journey transitions into the terminated state and they are associated
    with the user who requested the journey (which not necessarily is the rider).
                <br> <br>The transition to terminated happens automatically after 2 hours in production
    (10 minutes in sandbox environment).
                <br> <br>You can request them per user (requester of the journey), the client (all of
    your sales), or journey (all Sales associated to a specific journey which in most cases is just one).
  humanURL: https://developers.cabify.com/docs/ride-hailing
